# Builds the debug APK and publishes it as a GitHub release, so it installs on
# a phone or tablet from one link: android-latest from main, android-preview
# from any other branch. Each push replaces that release.
name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the Android SDK, with ANDROID_HOME set; Gradle
      # installs any platform it is missing.

      # Every build must be signed with the same key, or Android refuses to
      # install it over the previous one. The FANKA_DEBUG_KEYSTORE secret holds
      # that key, base64-encoded: a standard debug keystore (store and key
      # password "android", alias "androiddebugkey").
      - name: Debug signing key
        env:
          KEYSTORE: ${{ secrets.FANKA_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "FANKA_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No FANKA_DEBUG_KEYSTORE secret: this APK is signed with a one-off key and will not install over an earlier build."
          fi

      - run: npm ci

      # Without the two Supabase repository secrets the app still works
      # offline; only sign-in and sync are unavailable.
      - run: npm run build:app
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL || 'https://unconfigured.invalid' }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_ANON_KEY || 'unconfigured' }}

      - run: npx cap sync android

      - run: ./gradlew assembleDebug
        working-directory: android

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref == 'refs/heads/main' && 'android-latest' || 'android-preview' }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk fanka.apk
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" fanka.apk \
            --target "$GITHUB_SHA" \
            --title "Fanka Android ($GITHUB_REF_NAME)" \
            --notes "Debug build of ${GITHUB_SHA::7} from $GITHUB_REF_NAME." \
            ${{ github.ref != 'refs/heads/main' && '--prerelease' || '' }}
